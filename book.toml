[book]
language = "th"
title = "หนังสือ Leptos (ฉบับภาษาไทย)"

[output.html]
additional-css = [
    "./mdbook-admonish.css",
    "./mdbook-admonish-custom.css",
    "./sandbox.css",
]
additional-js = ["./sandbox.js"]
git-repository-url = "https://github.com/suradet-ps/leptos-th/tree/main/src"
edit-url-template = "https://github.com/suradet-ps/leptos-th/edit/main/src/{path}"
[output.html.playground]
runnable = false

[preprocessor]

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.0.1"    # do not edit: managed by `mdbook-admonish install`

[[preprocessor.admonish.custom]]
directive = "sandbox"
color = "#DCFF50"
icon = "./CodeSandbox-Square-Logo.svg"
